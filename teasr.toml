# Showcase capture. `wails dev` exposes the app to a browser at :34115 with the
# Go methods bound, so the real app is what gets photographed, not a mock.
#
# Only the screens reachable from a cold load are scripted here. teasr's web
# backend can click but cannot type into React-controlled inputs, and the board
# lives in frontend state rather than in the backend, so the populated
# whiteboard (showcase/demo.png) and the debrief (showcase/demo-review.png) were
# captured by driving a live session over the Chrome DevTools Protocol. Re-shoot
# those two by hand after a UI change.

[output]
dir = "./showcase"

[[output.formats]]
output_type = "png"

[server]
command = "wails dev -browser=false"
url = "http://localhost:34115"
# A cold `wails dev` compiles the Go side and installs the frontend first.
timeout = 240000

# ── Setup: provider, model, mode, level, timebox ──
[[scenes]]
type = "web"
name = "demo-setup"
uri = "/"
viewport = { width = 1440, height = 920 }

[[scenes.interactions]]
type = "wait"
duration = 3000
[[scenes.interactions]]
type = "snapshot"

# ── Progress: the cross-session skill profile ──
[[scenes]]
type = "web"
name = "demo-progress"
uri = "/"
viewport = { width = 1440, height = 920 }

[[scenes.interactions]]
type = "wait"
duration = 3000
[[scenes.interactions]]
type = "click"
selector = ".setup-header button"
[[scenes.interactions]]
type = "wait"
duration = 2000
[[scenes.interactions]]
type = "snapshot"
