# Showcase capture. `wails dev` exposes the app to a browser at :34115 with the
# Go methods bound, so the real app is what gets photographed, not a mock.
#
# Scope note: teasr's web backend renders at a fixed 800x600 here regardless of
# the scene's viewport setting, and it cannot type into React-controlled inputs.
# The progress screen is the only one that fits that box and needs no typing, so
# it is the only one scripted. The setup screen, a populated board, and a
# debrief are captured over the Chrome DevTools Protocol at 1440x920 instead:
# the last two need a real model and real work, which no scene can script. See
# "Capturing the showcase" in CONTRIBUTING.md.

[output]
dir = "./showcase"

[[output.formats]]
output_type = "png"

[server]
command = "wails dev -browser=false"
url = "http://localhost:34115"
# A cold `wails dev` compiles the Go side and installs the frontend first.
timeout = 240000

# ── Progress: the cross-session skill profile ──
[[scenes]]
type = "web"
name = "demo-progress"
uri = "/"

[[scenes.interactions]]
type = "wait"
duration = 3000
[[scenes.interactions]]
type = "click"
selector = ".setup-header button"
[[scenes.interactions]]
type = "wait"
duration = 2000
[[scenes.interactions]]
type = "snapshot"
